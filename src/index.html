<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ledger — Banking dashboard — dados bancários viram UX</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ledger — Banking dashboard — dados bancários viram UX. Semana 3 do roadmap Angular + Supabase."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes carregadas sem bloquear o render: o app aparece já com a stack
         de sistema e troca para Sora/Inter quando chegam (evita CLS no LCP). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Sora:wght@600..700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Sora:wght@600..700&display=swap"
      />
    </noscript>
    <script>
      // Aplica o tema antes da primeira pintura: o ThemeService só roda depois do
      // bootstrap, e sem isso a página piscaria no tema padrão antes de corrigir.
      (function () {
        try {
          var stored = localStorage.getItem('ledger:theme');
          var dark = stored
            ? stored === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
