<main class="flex min-h-svh items-center justify-center px-4 py-10">
  <section
    class="w-full max-w-sm rounded-3xl border border-border bg-surface/70 p-8 shadow-2xl shadow-black/40 backdrop-blur"
    aria-labelledby="login-title"
  >
    <div class="mb-8 text-center">
      <span
        class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-soft to-brand font-display text-2xl font-bold text-white shadow-lg shadow-brand/25"
        aria-hidden="true"
      >
        L
      </span>
      <h1 id="login-title" class="mt-5 text-2xl font-bold">Acesse seu Ledger</h1>
      <p class="mt-1.5 text-sm text-mute">Saldo, transações e extrato em um lugar só</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" class="space-y-4">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium">E-mail</label>
        <input
          id="email"
          name="email"
          ngModel
          type="email"
          required
          autocomplete="username"
          placeholder="voce@email.com"
          class="field"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium">Senha</label>
        <input
          id="password"
          name="password"
          ngModel
          type="password"
          required
          minlength="6"
          autocomplete="current-password"
          placeholder="••••••••"
          class="field"
        />
      </div>

      @if (error()) {
        <p class="rounded-xl border border-down/30 bg-down/10 px-3 py-2 text-sm text-down" role="alert">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading()"
        class="w-full rounded-xl bg-brand px-4 py-3 text-sm font-semibold text-white transition-colors hover:bg-brand-soft disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <div class="my-6 flex items-center gap-3 text-xs text-mute" aria-hidden="true">
      <span class="h-px flex-1 bg-border"></span>
      ou
      <span class="h-px flex-1 bg-border"></span>
    </div>

    <button
      type="button"
      (click)="loginDemo()"
      [disabled]="loading()"
      class="w-full rounded-xl border border-brand/40 py-3 text-sm font-medium text-brand-soft transition-colors hover:bg-brand/10 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Entrar como usuário demo
    </button>

    <p class="mt-6 text-center text-xs text-mute">
      Modo demo usa dados fictícios. Em produção, autenticação via Supabase Auth
      (sugestão: {{ demoEmail }}).
    </p>
  </section>
</main>
