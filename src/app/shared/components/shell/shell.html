<a class="sr-only focus:not-sr-only" href="#conteudo">Pular para o conteúdo</a>

<header class="sticky top-0 z-20 border-b border-border bg-surface/80 backdrop-blur lg:hidden">
  <div class="flex h-16 items-center justify-between px-4">
    <a routerLink="/dashboard" class="flex items-center gap-2 font-display text-lg font-bold">
      <span class="inline-block h-3 w-3 rounded-full bg-brand"></span>
      Ledger
    </a>

    <nav aria-label="Navegação principal" class="flex items-center gap-1">
      @for (item of nav; track item.href) {
        <a
          [routerLink]="item.href"
          routerLinkActive="aria-current:page"
          class="rounded-lg px-3 py-2 text-sm font-medium text-mute transition-colors hover:text-cream"
          >{{ item.label }}</a
        >
      }
      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeLabel()"
        class="theme-btn rounded-lg border border-transparent px-2.5 py-2 text-sm text-mute transition-colors hover:border-brand-soft hover:text-brand-soft"
      >
        <span aria-hidden="true">{{ isDark() ? '☀' : '☾' }}</span>
      </button>
      <button
        type="button"
        (click)="logout()"
        class="logout-btn rounded-lg border border-transparent px-3 py-2 text-xs text-mute transition-colors hover:border-down hover:text-down"
      >
        Sair
      </button>
    </nav>
  </div>
</header>

<div class="flex min-h-svh">
  <aside
    class="hidden w-64 shrink-0 lg:flex lg:flex-col sidebar"
    aria-label="Navegação lateral"
  >
    <a
      routerLink="/dashboard"
      class="flex h-16 items-center gap-2 border-b border-border px-5 font-display text-lg font-bold sidebar-header"
    >
      <span class="inline-block h-3 w-3 rounded-full bg-brand"></span>
      Ledger
    </a>

    <nav class="flex-1 space-y-1 p-3" aria-label="Navegação principal">
      @for (item of nav; track item.href) {
        <a [routerLink]="item.href" routerLinkActive="aria-current:page" class="nav-link">
          <span aria-hidden="true">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-footer p-4">
      <div class="user-info">
        <p class="text-xs text-mute">Saldo consolidado</p>
        <p class="mt-0.5 text-sm font-semibold tabular-nums">{{ totalLabel() }}</p>

        <div class="mt-4 flex items-center justify-between gap-2">
          <button
            type="button"
            (click)="toggleTheme()"
            [attr.aria-label]="themeLabel()"
            class="theme-btn flex-1 rounded-lg border border-border px-2.5 py-2 text-mute transition-colors hover:border-brand-soft hover:text-brand-soft"
          >
            <span aria-hidden="true">{{ isDark() ? '☀' : '☾' }}</span>
          </button>
          <button
            type="button"
            (click)="logout()"
            class="logout-btn flex-1 rounded-lg border border-border px-3 py-2 text-sm text-mute transition-colors hover:border-down hover:text-down"
          >
            Sair
          </button>
        </div>

        <p class="mt-4 truncate text-sm font-semibold" [attr.title]="userEmail()">{{ userName() }}</p>
        <p class="truncate text-xs text-mute">{{ userEmail() }}</p>
      </div>
    </div>
  </aside>

  <div class="min-w-0 flex-1">
    <main id="conteudo" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6">
      <router-outlet />
    </main>
  </div>
</div>
